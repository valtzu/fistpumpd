<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Three nodes boot one after another. The first founds the log, the others are attested and admitted by the members.">
<style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;--fg:#24292f;--mut:#57606a;--ac:#0969da;--ok:#1a7f37}
@media (prefers-color-scheme:dark){svg{--fg:#e6edf3;--mut:#8b949e;--ac:#58a6ff;--ok:#3fb950}}
text{text-anchor:middle;fill:var(--fg)}
.t{font-size:16px;font-weight:600}.s{font-size:13px;fill:var(--mut)}.cap{font-size:15px}
.ok{fill:var(--ok)}.ac{fill:var(--ac)}
rect,path{fill:none;stroke-width:1.5}
.cand{stroke:var(--mut);stroke-dasharray:5 4}.memb{stroke:var(--ok);stroke-width:2.5}
.ent,.ln{stroke:var(--fg)}.dot{stroke:var(--mut);stroke-dasharray:2 4}
.ar{stroke:var(--ac)}#h path{fill:var(--ac);stroke:none}
@keyframes n0{0%{opacity:0}1.85%,97.41%{opacity:1}99.26%,100%{opacity:0}}
.n0{opacity:1;animation:n0 27s linear infinite}
